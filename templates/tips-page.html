{% extends "base.html" %}

{% block content %}
<h1 class="title">
  {{ page.title }}
</h1>
{{ page.content | safe }}

<p class="note">{{ page.date | date(format="%Y-%m-%d") }}</p>

{% if page.updated %}
  <p class="note"> Updated {{ page.updated | date(format="%Y-%m-%d") }}</p>
{% endif %}

{% endblock content %}
