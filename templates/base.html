<!DOCTYPE html>
<html lang="en" class="dark orange">

<head>
    <meta charset="utf-8">
    <title>
        {% if page.title %}
            {{ page.title }} | {{ config.title }}
        {% elif section.title %}
            {{ section.title }} | {{ config.title }}
        {% else %}
            {{ config.title }}
        {% endif %}
    </title>

    <link rel="icon" type="image/svg+xml" href="/logo.svg">

    <link rel="stylesheet" href="{{ get_url(path="base.css") }}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">  

    <meta property="og:title" content="
        {%- if page.title -%}
            {{ page.title }}
        {%- elif section.title -%}
            {{ section.title }}
        {%- else -%}
            {{ config.title }}
        {%- endif -%}
    " />
    {%- if page.description or section.description -%}
    <meta property="og:description" content="
        {%- if page.description -%}
            {{ page.description }}
        {%- elif section.description -%}
            {{ section.description }}
        {%- endif -%}
    " />
    {%- endif -%}
    <meta property="og:site_name" content="{{ config.title }}" />
    <meta property="og:image" content="
        {%- if page.image -%}
            {{ get_url(path=page.image) }}
        {%- else -%}
            {{ get_url(path="og-image.png") }}
        {%- endif -%}
    " />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="{{current_url | safe}}" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="{{current_url | safe}}" />
    {%- if page.description or section.description -%}
    <meta name="description" content="
        {%- if page.description -%}
            {{ page.description }}
        {%- elif section.description -%}
            {{ section.description }}
        {%- endif -%}
    " />
    {%- endif -%}

    {% block atom %}
        <link rel="alternate" type="application/atom+xml" title="Atom" href="{{ get_url(path="atom.xml", trailing_slash=false) }}">
    {% endblock %}
</head>

<body>
    <div class="site-wrapper">
        <header class="site-header">
            {% include "header.html" %}
        </header>
        
        <main class="site-content">
            <div class="container">
                {% block content %} {% endblock content %}
            </div>
        </main>

        <div class="site-footer">
            {% include "footer.html" %}
        </div>
    </div>
</body>

</html>
